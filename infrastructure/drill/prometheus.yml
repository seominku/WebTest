global:
  scrape_interval: 5s
  scrape_timeout: 2s
  evaluation_interval: 5s

rule_files: [/etc/prometheus/alerts.yml]

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: drill-exporter
    static_configs:
      - targets: ["exporter:8080"]
