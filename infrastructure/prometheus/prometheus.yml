global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: real-estate-api
    metrics_path: /api/v1/health/metrics/prometheus
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics-token
    static_configs:
      - targets:
          - api:4000
